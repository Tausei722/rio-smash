name: Supabase Keepalive

# Supabase Freeプランは7日間アクセスが無いとプロジェクトが自動一時停止される。
# それを防ぐため、定期的に軽いリクエストを送って「アクティビティ」を発生させる。
on:
  schedule:
    - cron: '0 3 */3 * *' # 3日おき 03:00 UTC(正午ごろJST)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping EigoTaisen本番DB (xilrpvnierjjuouduqsg)
        run: |
          curl -sf -o /dev/null -w 'status=%{http_code}\n' \
            -H "apikey: ${EIGOTAISEN_ANON_KEY}" \
            -H "Authorization: Bearer ${EIGOTAISEN_ANON_KEY}" \
            "https://xilrpvnierjjuouduqsg.supabase.co/rest/v1/words?select=id&limit=1"
        env:
          EIGOTAISEN_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhpbHJwdm5pZXJqanVvdWR1cXNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2NDkwMTYsImV4cCI6MjA5MTIyNTAxNn0.PYzS3cvJ6ZRIxgVYzaBYa9emsNg8aw4hlhs5gyeFOoE

      - name: Ping Tausei722's Project (ehqhipghekqkrhfromef)
        run: |
          curl -sf -o /dev/null -w 'status=%{http_code}\n' \
            -H "apikey: ${TAUSEI722_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${TAUSEI722_PUBLISHABLE_KEY}" \
            "https://ehqhipghekqkrhfromef.supabase.co/rest/v1/profiles?select=id&limit=1"
        env:
          TAUSEI722_PUBLISHABLE_KEY: sb_publishable_Up4YlSTRdLAuMk4KxDVQtQ_encFbIGe
